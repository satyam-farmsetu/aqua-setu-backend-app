[project]
name = "aqua-setu-backend-app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "satyamseth", email = "satyam@farmsetu.co" }
]
requires-python = ">=3.14"
dependencies = [
    "django>=6.1.2",
    "django-cors-headers>=4.9.0",
    "django-extensions>=4.1",
    "django-filter>=26.2",
    "django-import-export>=4.4.1",
    "django-redis>=7.0.0",
    "djangorestframework>=3.18.3",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular[sidecar]>=0.30.0",
    "psycopg[binary]>=3.3.6",
    "python-decouple>=3.8",
]

[project.optional-dependencies]
dev = [
    "coverage>=7.16.2",
    "decouple-types>=1.0.2",
    "django-filter-stubs>=0.1.3",
    "django-stubs>=6.1.2",
    "djangorestframework-stubs>=3.18.1",
    "mypy>=2.4.0",
    "pygraphviz>=2.0.3",
    "ruff>=0.16.10",
    "types-django-import-export>=4.4.0.20260813",
]
prod = [
    "django-storages[s3]>=1.14.6",
    "gunicorn>=26.2.0",
    "whitenoise>=6.12.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "D1",      # pydocstyle: missing docstrings
    "B",       # flake8-bugbear
    "UP",      # pyupgrade
    "SIM",     # flake8-simplify
    "DJ",      # flake8-django
    "PL",      # pylint
    "RUF",     # ruff-specific
]
ignore = ["E501"]  # line length is handled by the formatter

[tool.ruff.lint.per-file-ignores]
"manage.py" = ["PLC0415"]  # Django's lazy import of execute_from_command_line

[tool.ruff.lint.isort]
known-first-party = ["aqua_setu"]
